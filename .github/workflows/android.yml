name: Build GlassMorph Engine APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (Required for modern Android/Gradle builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle environment on the runner
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Generate Gradle Wrapper dynamically
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # 5. Grant execute permission to the newly generated wrapper
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 6. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassMorphEngine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 8. (Optional) Build Unsigned Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 9. Upload Release APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassMorphEngine-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
