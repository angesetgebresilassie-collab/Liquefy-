name: Build GlassMorph Engine APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Generate Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # 5. Grant execute permission
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 6. Generate Dummy Debug Keystore
      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 7. Build Debug APK with explicit environment flags
      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          ./gradlew assembleDebug \
            -Djava.awt.headless=true \
            -Dksp.incremental=false \
            -PsuppressKotlinVersionCompatibilityCheck=true \
            --stacktrace

      # 8. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassMorphEngine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
